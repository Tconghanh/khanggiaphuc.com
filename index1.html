<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0071ba">

    <title>KGP Telecom - Giải Pháp Viễn Thông & Công Nghệ Hàng Đầu</title>
    <meta name="description" content="KGP Telecom chuyên cung cấp giải pháp viễn thông, camera giám sát, hệ thống mạng và điện năng lượng mặt trời uy tín.">
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

    <style>
        :root {
            --primary: #0071ba; --primary-light: #38bdf8; --primary-dark: #005a96;
            --secondary: #ff8a22; --danger: #d92027;
            --text-main: #1e293b; --text-muted: #64748b;
            --bg-light: #f8fafc; --white: #ffffff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius: 12px; --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--text-main); line-height: 1.5; overflow-x: hidden; background: #fff; }
        
        /* Tối ưu render */
        section { content-visibility: auto; contain-intrinsic-size: 1px 500px; padding: 60px 20px; max-width: 1300px; margin: auto; }

        /* --- HEADER TỐI ƯU --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000; height: 70px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05); transition: var(--transition);
        }
        header.scrolled { height: 60px; box-shadow: var(--shadow); background: rgba(255, 255, 255, 0.95); }
        
        nav { max-width: 1400px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo img { height: 40px; width: auto; transition: transform 0.3s; }
        
        .search-box { position: relative; width: 300px; }
        .search-box input { 
            width: 100%; padding: 8px 35px 8px 15px; border-radius: 20px; border: 1px solid #e2e8f0; 
            background: #f1f5f9; outline: none; transition: var(--transition);
        }
        .search-box input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,113,186,0.1); }

        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* --- HERO SLIDER MƯỢT MÀ --- */
        .hero-slider {
            position: relative; height: 550px; margin-top: 70px; overflow: hidden; background: #000;
        }
        .slider-track {
            display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            will-change: transform;
        }
        .slide {
            min-width: 100%; height: 100%; position: relative;
        }
        .slide img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.8;
            transform: scale(1.1); transition: transform 6s linear;
        }
        .slide.active img { transform: scale(1); }

        .slider-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 10;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s; }
        .dot.active { background: var(--white); width: 30px; border-radius: 10px; }

        /* --- PRODUCT GRID --- */
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 2rem; font-weight: 800; color: var(--primary); text-transform: uppercase; position: relative; display: inline-block; }
        .section-title h2::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: var(--secondary); border-radius: 2px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .product-card {
            background: #fff; border-radius: var(--radius); padding: 15px; border: 1px solid #f1f5f9;
            transition: var(--transition); cursor: pointer; display: flex; flex-direction: column;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: var(--shadow); border-color: var(--primary-light); }
        .product-card img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; }
        .product-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; height: 45px; overflow: hidden; }
        .product-card .price { color: var(--danger); font-weight: 800; font-size: 1.1rem; margin-top: auto; }

        /* --- PROJECT SLIDER CAO CẤP --- */
        .projects-section { background: #0f172a; color: #fff; overflow: hidden; }
        .project-container { position: relative; padding: 0 50px; }
        .project-slider {
            display: flex; gap: 20px; transition: transform 0.6s var(--transition);
            cursor: grab;
        }
        .project-card {
            min-width: 320px; background: rgba(255,255,255,0.05); border-radius: 15px; overflow: hidden;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); transition: 0.4s;
        }
        .project-card:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }
        .project-card img { width: 100%; height: 200px; object-fit: cover; }
        .project-card .info { padding: 15px; }
        
        .proj-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 45px; height: 45px; background: var(--primary); border: none;
            border-radius: 50%; color: #fff; cursor: pointer; z-index: 5; transition: 0.3s;
        }
        .proj-btn:hover { background: var(--secondary); transform: translateY(-50%) scale(1.1); }
        .prev-proj { left: 0; } .next-proj { right: 0; }

        /* --- MOBILE TỐI ƯU --- */
        @media (max-width: 768px) {
            header .search-box, .nav-links { display: none; }
            .hero-slider { height: 250px; }
            .project-card { min-width: 280px; }
            .project-container { padding: 0 10px; }
            .proj-btn { display: none; }
        }

        /* Loading Spinner */
        #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <header id="main-header">
        <nav>
            <a href="#" class="logo"><img src="https://khanggiaphuc.com/data/logo.jpg" alt="Logo"></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm sản phẩm...">
                <i class="fa-solid fa-magnifying-glass" style="position:absolute; right:12px; top:11px; color:var(--primary)"></i>
            </div>
            <ul class="nav-links">
                <li><a href="#products">Sản phẩm</a></li>
                <li><a href="#intro">Giới thiệu</a></li>
                <li><a href="#projects">Dự án</a></li>
                <li><a href="tel:0844900099" style="color:var(--danger)"><i class="fa-solid fa-phone"></i> 0844.900.099</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-slider">
        <div class="slider-track" id="heroTrack">
            <div class="slide active"><img src="https://khanggiaphuc.com/data/SL1.jpg" fetchpriority="high" alt="Slide 1"></div>
            <div class="slide"><img src="https://khanggiaphuc.com/data/SL2.jpg" loading="lazy" alt="Slide 2"></div>
            <div class="slide"><img src="https://khanggiaphuc.com/data/SL3.jpg" loading="lazy" alt="Slide 3"></div>
            <div class="slide"><img src="https://khanggiaphuc.com/data/SL4.jpg" loading="lazy" alt="Slide 4"></div>
        </div>
        <div class="slider-nav" id="heroNav"></div>
    </div>

    <section id="products">
        <div class="section-title"><h2>Sản phẩm nổi bật</h2></div>
        <div class="product-grid" id="productGrid">
            <!-- Sản phẩm sẽ load từ JS -->
        </div>
    </section>

    <section id="projects" class="projects-section">
        <div class="section-title"><h2 style="color:#fff">Dự án tiêu biểu</h2></div>
        <div class="project-container">
            <button class="proj-btn prev-proj" onclick="moveProject(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <div style="overflow: hidden;">
                <div class="project-slider" id="projectSlider">
                    <!-- Dự án sẽ load từ JS -->
                </div>
            </div>
            <button class="proj-btn next-proj" onclick="moveProject(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </section>

    <footer style="background:#0b1220; color:#94a3b8; padding:50px 20px; text-align:center">
        <p>© 2024 KGP Telecom - Giải pháp công nghệ chuyên nghiệp</p>
    </footer>

    <script>
        const SHEET_ID = '1knLdhA1j69Qqfa6nMIe20vfufQnvGr4THpehnK0mHPk';
        const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let currentHero = 0;
        let projectIndex = 0;

        // 1. FETCH DATA TỐI ƯU
        async function loadAllData() {
            try {
                const [prodRes, projRes] = await Promise.all([
                    fetch(`${BASE_URL}&sheet=SanPham`),
                    fetch(`${BASE_URL}&sheet=Du_An`)
                ]);

                const prodData = await parseSheet(prodRes);
                const projData = await parseSheet(projRes);

                renderProducts(prodData);
                renderProjects(projData);
                
                document.getElementById('loader').style.display = 'none';
                initHeroSlider();
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
        }

        async function parseSheet(res) {
            const text = await res.text();
            const json = JSON.parse(text.substring(47).slice(0, -2));
            return json.table.rows;
        }

        // 2. RENDER PRODUCTS
        function renderProducts(rows) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = rows.slice(0, 12).map(r => {
                const ma = r.c[0]?.v || '';
                const ten = r.c[1]?.v || '';
                const gia = r.c[5]?.v || 0;
                return `
                    <div class="product-card">
                        <img src="https://khanggiaphuc.com/data/${ma}.jpg" onerror="this.src='https://via.placeholder.com/200'" alt="${ten}" loading="lazy">
                        <h3>${ten}</h3>
                        <div class="price">${gia > 0 ? gia.toLocaleString() + 'đ' : 'Liên hệ'}</div>
                    </div>
                `;
            }).join('');
        }

        // 3. RENDER PROJECTS (SLIDER)
        function renderProjects(rows) {
            const slider = document.getElementById('projectSlider');
            slider.innerHTML = rows.slice(1).map(r => `
                <div class="project-card">
                    <img src="https://khanggiaphuc.com/data/${r.c[0]?.v}.jpg" loading="lazy" alt="Project">
                    <div class="info">
                        <h4 style="font-weight:700">${r.c[1]?.v}</h4>
                        <p style="font-size:0.8rem; opacity:0.7; margin-top:5px">${r.c[2]?.v}</p>
                    </div>
                </div>
            `).join('');
        }

        // 4. HERO SLIDER LOGIC
        function initHeroSlider() {
            const track = document.getElementById('heroTrack');
            const slides = document.querySelectorAll('.slide');
            const nav = document.getElementById('heroNav');
            
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = () => goToHero(i);
                nav.appendChild(dot);
            });

            setInterval(() => {
                currentHero = (currentHero + 1) % slides.length;
                updateHeroUI();
            }, 5000);
        }

        function updateHeroUI() {
            const track = document.getElementById('heroTrack');
            const dots = document.querySelectorAll('.dot');
            const slides = document.querySelectorAll('.slide');
            
            track.style.transform = `translate3d(-${currentHero * 100}%, 0, 0)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === currentHero));
            slides.forEach((s, i) => s.classList.toggle('active', i === currentHero));
        }

        function goToHero(i) { currentHero = i; updateHeroUI(); }

        // 5. PROJECT SLIDER NAVIGATION
        function moveProject(dir) {
            const slider = document.getElementById('projectSlider');
            const cardWidth = 340; // width + gap
            const maxScroll = slider.children.length - 1;
            
            projectIndex += dir;
            if (projectIndex < 0) projectIndex = 0;
            if (projectIndex > maxScroll - 2) projectIndex = maxScroll - 2;

            slider.style.transform = `translate3d(-${projectIndex * cardWidth}px, 0, 0)`;
        }

        // 6. SCROLL EFFECT
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            header.classList.toggle('scrolled', window.scrollY > 50);
        });

        // Khởi chạy
        loadAllData();
    </script>
</body>
</html>
