<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Tập Tin - R2 Explorer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; }
        header { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.25rem; font-weight: 700; background: linear-gradient(to right, #38bdf8, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .server-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; background: rgba(34, 197, 94, 0.1); color: #4ade80; padding: 0.35rem 0.75rem; border-radius: 9999px; border: 1px solid rgba(34, 197, 94, 0.2); }
        .container { flex: 1; max-width: 1400px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; }
        .explorer-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .toolbar { padding: 1.25rem; background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid var(--border-color); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
        
        .path-navigation { display: flex; align-items: center; gap: 0.5rem; background: rgba(0, 0, 0, 0.2); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); flex: 1; min-width: 250px; overflow-x: auto; }
        .path-item { color: var(--text-muted); cursor: pointer; transition: color 0.2s; white-space: nowrap; }
        .path-item:hover { color: var(--text-main); }
        .path-separator { color: rgba(255, 255, 255, 0.2); }
        .path-item.active { color: var(--text-main); font-weight: 500; }

        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        .btn-primary { background: var(--primary); border: none; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        
        .btn-action { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; transition: color 0.2s; }
        .btn-action.btn-rename:hover { color: var(--warning); }
        .btn-action.btn-delete:hover { color: var(--danger); }

        .progress-container { width: 100%; background: rgba(0, 0, 0, 0.3); height: 6px; display: none; position: relative; }
        .progress-bar { height: 100%; background: linear-gradient(to right, #38bdf8, #22c55e); width: 0%; transition: width 0.1s ease; }
        .file-table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(15, 23, 42, 0.2); padding: 1rem 1.25rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
        td { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; white-space: nowrap; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .file-name-container { display: flex; align-items: center; gap: 1rem; }
        .file-icon { font-size: 1.25rem; width: 24px; text-align: center; }
        .icon-folder { color: #eab308; }
        .icon-image { color: #ec4899; }
        .icon-code { color: #38bdf8; }
        .icon-file { color: #94a3b8; }
        .file-link { color: var(--text-main); text-decoration: none; font-weight: 500; cursor: pointer; transition: color 0.2s; }
        .file-link:hover { color: #38bdf8; text-decoration: underline; }
        .file-size, .file-date { color: var(--text-muted); }
        .empty-state { padding: 4rem 2rem; text-align: center; color: var(--text-muted); display: none; }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="brand"><i class="fa-solid fa-folder-tree"></i> <span>R2 EXPLORER SECURE</span></div>
        <div class="server-status"><i class="fa-solid fa-shield-halved"></i> <span id="statusTxt">Bảo mật tối đa</span></div>
    </header>

    <div class="container">
        <div class="explorer-panel">
            <div class="toolbar">
                <div class="path-navigation" id="pathNav"></div>
                <div class="actions">
                    <button class="btn" onclick="logoutSystem()" title="Đổi mật khẩu"><i class="fa-solid fa-key"></i> Đăng xuất</button>
                    <button class="btn" onclick="refreshDirectory()"><i class="fa-solid fa-arrow-rotate-right"></i> Làm mới</button>
                    <input type="file" id="fileChooser" style="display: none;" onchange="uploadLargeFile(this.files)">
                    <button class="btn btn-primary" id="uploadBtn" onclick="document.getElementById('fileChooser').click()">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên tại đây
                    </button>
                </div>
            </div>

            <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>

            <div class="file-table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 45%;">Tên</th>
                            <th style="width: 15%;">Kích thước</th>
                            <th style="width: 25%;">Ngày cập nhật</th>
                            <th style="width: 15%; text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="fileList"></tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-folder-open"></i>
                <p id="emptyStateText">Thư mục trống.</p>
            </div>
        </div>
    </div>

    <script>
        const WORKER_API_URL = 'https://upload.tconghanh.workers.dev'; 
        let currentPath = ''; 

        // Hàm lấy Token từ bộ nhớ, nếu chưa có sẽ chủ động hỏi người dùng
        function getAuthToken() {
            let token = localStorage.getItem('r2_access_token');
            if (!token) {
                token = prompt("Mời anh nhập Mật khẩu bảo mật hệ thống R2:");
                if (token && token.trim() !== "") {
                    localStorage.setItem('r2_access_token', token.trim());
                    return token.trim();
                }
            }
            return token || '';
        }

        function logoutSystem() {
            localStorage.removeItem('r2_access_token');
            location.reload();
        }

        function getIcon(name, isDir) {
            if (isDir) return '<i class="fa-solid fa-folder icon-folder"></i>';
            const ext = name.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp'].includes(ext)) return '<i class="fa-solid fa-file-image icon-image"></i>';
            if (['html', 'css', 'js', 'json', 'py', 'php'].includes(ext)) return '<i class="fa-solid fa-file-code icon-code"></i>';
            return '<i class="fa-solid fa-file-lines icon-file"></i>';
        }

        function renderBreadcrumbs() {
            const nav = document.getElementById('pathNav');
            let html = `<span class="path-item" onclick="navigateToPath('')"><i class="fa-solid fa-house"></i> Root</span>`;
            
            if (currentPath) {
                const parts = currentPath.split('/').filter(p => p);
                let buildPath = '';
                parts.forEach((part, index) => {
                    buildPath += part + '/';
                    html += ` <span class="path-separator">/</span> `;
                    if (index === parts.length - 1) {
                        html += `<span class="path-item active">${part}</span>`;
                    } else {
                        html += `<span class="path-item" onclick="navigateToPath('${buildPath}')">${part}</span>`;
                    }
                });
            }
            nav.innerHTML = html;
        }

        function navigateToPath(path) {
            currentPath = path;
            refreshDirectory();
        }

        // ĐỌC DANH SÁCH FILE VÀ FOLDER
        async function refreshDirectory() {
            const token = getAuthToken();
            if (!token) {
                document.getElementById('fileList').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger); padding:2rem;">Yêu cầu nhập mật khẩu bảo mật để xem dữ liệu. Trình duyệt sẽ tự động tải lại...</td></tr>`;
                setTimeout(() => location.reload(), 1500);
                return;
            }

            renderBreadcrumbs();
            const tbody = document.getElementById('fileList');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 2rem;"><i class="fa-solid fa-spinner fa-spin"></i> Đang đọc dữ liệu mã hóa R2...</td></tr>`;
            emptyState.style.display = 'none';

            try {
                let response = await fetch(`${WORKER_API_URL}?prefix=${encodeURIComponent(currentPath)}`, {
                    headers: { 'Authorization': token }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('r2_access_token');
                    alert("Mật khẩu không chính xác! Vui lòng nhập lại.");
                    location.reload();
                    return;
                }

                if (!response.ok) throw new Error("Kết nối gặp sự cố");
                
                let items = await response.json();
                tbody.innerHTML = '';

                if (currentPath !== '') {
                    const parentRow = document.createElement('tr');
                    parentRow.innerHTML = `
                        <td colspan="4">
                            <div class="file-name-container" style="cursor: pointer;" onclick="goUpToParent()">
                                <i class="fa-solid fa-arrow-turn-up" style="transform: rotate(-90deg); color: #38bdf8;"></i>
                                <span class="file-link">[ Thư mục cha .. ]</span>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(parentRow);
                }

                if (!items || items.length === 0) {
                    if (currentPath === '') emptyState.style.display = 'block';
                    return;
                }

                items.forEach(item => {
                    const row = document.createElement('tr');
                    let displayName = item.name.replace(currentPath, '');
                    if (item.isDir && displayName.endsWith('/')) displayName = displayName.slice(0, -1);

                    if (item.isDir) {
                        row.innerHTML = `
                            <td>
                                <div class="file-name-container" onclick="navigateToPath('${item.name}')">
                                    ${getIcon(item.name, true)}
                                    <span class="file-link" style="color: #eab308; font-weight:600;">${displayName}</span>
                                </div>
                            </td>
                            <td class="file-size">--</td>
                            <td class="file-date">--</td>
                            <td style="text-align:center;">--</td>
                        `;
                    } else {
                        // Link download cần gửi kèm Token thông qua API của Worker để tránh rò rỉ link gốc
                        const downloadUrl = `${WORKER_API_URL}/${encodeURIComponent(item.name)}`;
                        row.innerHTML = `
                            <td>
                                <div class="file-name-container">
                                    ${getIcon(item.name, false)}
                                    <span class="file-link" onclick="downloadSecureFile('${item.name}', '${displayName}')">
                                        ${displayName}
                                    </span>
                                </div>
                            </td>
                            <td class="file-size">${item.size}</td>
                            <td class="file-date">${item.date}</td>
                            <td style="text-align: center;">
                                <button class="btn-action btn-rename" onclick="renameFile('${item.name}', '${displayName}')" title="Đổi tên"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="btn-action btn-delete" onclick="deleteFile('${item.name}')" title="Xóa tập tin"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        `;
                    }
                    tbody.appendChild(row);
                });

            } catch (error) {
                tbody.innerHTML = '';
                document.getElementById('emptyStateText').innerHTML = `<span style="color: var(--danger);">Lỗi kết nối bảo mật!</span>`;
                emptyState.style.display = 'block';
            }
        }

        function goUpToParent() {
            const parts = currentPath.split('/').filter(p => p);
            parts.pop();
            currentPath = parts.length > 0 ? parts.join('/') + '/' : '';
            refreshDirectory();
        }

        // TẢI XUỐNG FILE BẢO MẬT (CÓ GỬI KÈM TOKEN ĐĂNG NHẬP Ở HEADER)
        async function downloadSecureFile(fileKey, fileName) {
            const token = getAuthToken();
            try {
                let response = await fetch(`${WORKER_API_URL}/${encodeURIComponent(fileKey)}`, {
                    headers: { 'Authorization': token }
                });
                if (!response.ok) { alert("Không thể tải tập tin."); return; }
                
                const blob = await response.blob();
                const dlUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = dlUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                alert("Lỗi tải xuống: " + e.message);
            }
        }

        // THAO TÁC XÓA FILE
        async function deleteFile(fileKey) {
            const token = getAuthToken();
            const fileNameOnly = fileKey.split('/').pop();
            if (!confirm(`Anh có chắc chắn muốn xóa tập tin "${fileNameOnly}" này khỏi hệ thống R2 không?`)) return;

            try {
                let response = await fetch(`${WORKER_API_URL}/${encodeURIComponent(fileKey)}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': token }
                });
                
                if (response.ok) {
                    alert("Đã xóa tập tin thành công!");
                    refreshDirectory();
                } else {
                    let err = await response.json();
                    alert("Lỗi: " + (err.error || "Không thể xóa"));
                }
            } catch (error) {
                alert("Lỗi kết nối mạng: " + error.message);
            }
        }

        // THAO TÁC ĐỔI TÊN FILE
        async function renameFile(oldKey, currentName) {
            const token = getAuthToken();
            const newName = prompt("Mời anh nhập tên mới cho tập tin này:", currentName);
            if (!newName || newName.trim() === "" || newName === currentName) return;

            const newKey = currentPath + newName.trim();

            try {
                let response = await fetch(`${WORKER_API_URL}/rename`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({ oldKey: oldKey, newKey: newKey })
                });

                if (response.ok) {
                    alert("Đổi tên tập tin thành công!");
                    refreshDirectory();
                } else {
                    let err = await response.json();
                    alert("Lỗi: " + (err.error || "Không thể đổi tên"));
                }
            } catch (error) {
                alert("Lỗi kết nối: " + error.message);
            }
        }

        // TẢI FILE LÊN ĐÚNG VỊ TRÍ THƯ MỤC THÀNH CÔNG VỚI TOKEN
        async function uploadLargeFile(files) {
            if (files.length === 0) return;
            const token = getAuthToken();
            const file = files[0];
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const fullTargetName = currentPath + file.name;

            const originalText = uploadBtn.innerHTML;
            uploadBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Khởi tạo...`;
            uploadBtn.disabled = true;

            try {
                let tokenResponse = await fetch(`${WORKER_API_URL}/get-upload-url`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({ fileName: fullTargetName })
                });

                if (!tokenResponse.ok) throw new Error("Worker từ chối");
                let tokenResult = await tokenResponse.json();
                const uploadUrl = tokenResult.uploadUrl;

                progressContainer.style.display = 'block';
                uploadBtn.innerHTML = `<i class="fa-solid fa-arrow-up-from-bracket"></i> Đang truyền...`;

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', uploadUrl, true);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status === 200 || xhr.status === 201) {
                        alert(`Tải lên thành công!`);
                        refreshDirectory();
                    } else {
                        alert('Lỗi lưu trữ!');
                    }
                    resetUploadStatus(uploadBtn, originalText, progressContainer, progressBar);
                };

                xhr.send(file);
            } catch (error) {
                alert("Lỗi: " + error.message);
                resetUploadStatus(uploadBtn, originalText, progressContainer, progressBar);
            }
        }

        function resetUploadStatus(btn, text, container, bar) {
            btn.innerHTML = text; btn.disabled = false;
            container.style.display = 'none'; bar.style.width = '0%';
            document.getElementById('fileChooser').value = '';
        }

        window.onload = refreshDirectory;
    </script>
</body>
</html>
