<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Tập Tin - R2 Explorer Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7); --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; --text-muted: #94a3b8; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="light"] {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --panel-bg: rgba(255, 255, 255, 0.8); --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a; --text-muted: #64748b; --success: #16a34a; --danger: #dc2626; --warning: #d97706;
        }
        [data-theme="cyberpunk"] {
            --primary: #ff0055; --primary-hover: #cc0044;
            --bg-gradient: linear-gradient(135deg, #000411 0%, #001242 100%);
            --panel-bg: rgba(0, 4, 17, 0.85); --border-color: #00ffcc;
            --text-main: #00ffcc; --text-muted: #9d00ff; --success: #00ff66; --danger: #ff0055; --warning: #ffcc00;
        }
        [data-theme="classic"] {
            --primary: #047857; --primary-hover: #065f46;
            --bg-gradient: linear-gradient(135deg, #14532d 0%, #052e16 100%);
            --panel-bg: rgba(20, 83, 45, 0.7); --border-color: rgba(255, 255, 255, 0.15);
            --text-main: #f0fdf4; --text-muted: #a7f3d0; --success: #4ade80; --danger: #f87171; --warning: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; transition: all 0.3s ease; }
        header { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        
        .btn-home {
            display: flex; align-items: center; gap: 0.5rem;
            background: rgba(255, 255, 255, 0.08); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0.5rem 1rem;
            border-radius: 8px; text-decoration: none; font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-home:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-1px); }

        .header-right { display: flex; align-items: center; gap: 1rem; }
        .theme-select { background: rgba(0, 0, 0, 0.2); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.35rem 0.75rem; border-radius: 6px; outline: none; font-size: 0.85rem; cursor: pointer; }
        .theme-select option { background: #0f172a; color: #fff; }
        
        .server-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; background: rgba(34, 197, 94, 0.1); color: var(--success); padding: 0.35rem 0.75rem; border-radius: 9999px; border: 1px solid var(--border-color); }
        .container { flex: 1; max-width: 1400px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; }
        
        .explorer-panel { 
            background: var(--panel-bg); backdrop-filter: blur(16px); 
            border: 2px solid var(--border-color); border-radius: 16px; 
            overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
            transition: border-color 0.2s ease, background-color 0.2s ease; position: relative;
        }
        .explorer-panel.drag-over { border-color: var(--primary) !important; background-color: rgba(37, 99, 235, 0.15) !important; }
        .drag-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10; gap: 1rem; 
            color: var(--primary); font-size: 1.5rem; font-weight: 600; pointer-events: none;
        }
        .explorer-panel.drag-over .drag-overlay { display: flex; }

        .toolbar { padding: 1.25rem; background: rgba(15, 23, 42, 0.2); border-bottom: 1px solid var(--border-color); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
        .path-navigation { display: flex; align-items: center; gap: 0.5rem; background: rgba(0, 0, 0, 0.2); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); flex: 1; min-width: 250px; overflow-x: auto; }
        .path-item { color: var(--text-muted); cursor: pointer; transition: color 0.2s; white-space: nowrap; }
        .path-item:hover { color: var(--text-main); }
        .path-separator { color: rgba(255, 255, 255, 0.2); }
        .path-item.active { color: var(--text-main); font-weight: 500; }

        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        .btn-primary { background: var(--primary); border: none; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        
        .btn-action { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem 0.4rem; font-size: 1rem; transition: color 0.2s; }
        .btn-action.btn-edit-text:hover { color: #38bdf8; }
        .btn-action.btn-copy:hover { color: var(--primary); }
        .btn-action.btn-rename:hover { color: var(--warning); }
        .btn-action.btn-delete:hover { color: var(--danger); }

        .admin-control { display: none; }

        .upload-queue-container {
            background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid var(--border-color);
            padding: 1rem; display: none; flex-direction: column; gap: 0.75rem; max-height: 250px; overflow-y: auto;
        }
        .queue-item { display: flex; flex-direction: column; gap: 0.35rem; background: rgba(255, 255, 255, 0.03); padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .queue-item-info { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .queue-item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .queue-item-status { font-weight: 600; font-size: 0.8rem; }
        .queue-item-progress-bg { width: 100%; background: rgba(0, 0, 0, 0.3); height: 6px; border-radius: 3px; overflow: hidden; }
        .queue-item-progress-bar { height: 100%; background: linear-gradient(to right, #38bdf8, var(--success)); width: 0%; transition: width 0.1s ease; }

        .file-table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(15, 23, 42, 0.1); padding: 1rem 1.25rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
        td { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; white-space: nowrap; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .file-name-container { display: flex; align-items: center; gap: 1rem; }
        .file-icon { font-size: 1.25rem; width: 24px; text-align: center; }
        .icon-folder { color: #eab308; }
        .icon-image { color: #ec4899; }
        .icon-code { color: #38bdf8; }
        .icon-file { color: var(--text-muted); }
        .file-link { color: var(--text-main); text-decoration: none; font-weight: 500; cursor: pointer; transition: color 0.2s; }
        .file-link:hover { color: var(--primary); text-decoration: underline; }
        .file-size, .file-date { color: var(--text-muted); }
        .empty-state { padding: 4rem 2rem; text-align: center; color: var(--text-muted); display: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-home" title="Đường dẫn quay về trang chủ chính">
            <i class="fa-solid fa-house"></i> <span>Về trang chủ</span>
        </a>

        <div class="header-right">
            <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">🌙 Giao diện Tối</option>
                <option value="light">☀️ Giao diện Sáng</option>
                <option value="cyberpunk">⚡ Giao diện Cyberpunk</option>
                <option value="classic">🌲 Giao diện Cổ điển</option>
            </select>
            <div class="server-status"><i class="fa-solid fa-user-shield"></i> &nbsp;<span id="roleTxt">Đang kiểm tra...</span></div>
        </div>
    </header>

    <div class="container">
        <div class="explorer-panel" id="dropZone">
            <div class="drag-overlay">
                <i class="fa-solid fa-cloud-arrow-up fa-2xl"></i>
                <span>Thả các tập tin vào đây để tự động tải lên!</span>
            </div>

            <div class="toolbar">
                <div class="path-navigation" id="pathNav"></div>
                <div class="actions">
                    <button class="btn admin-control" onclick="createNewFolder()"><i class="fa-solid fa-folder-plus" style="color:#eab308;"></i> Tạo thư mục</button>
                    <button class="btn" onclick="logoutSystem()"><i class="fa-solid fa-key"></i> Đăng xuất</button>
                    <button class="btn" onclick="refreshDirectory()"><i class="fa-solid fa-arrow-rotate-right"></i> Làm mới</button>
                    <input type="file" id="fileChooser" style="display: none;" multiple onchange="uploadMultipleFiles(this.files)">
                    <button class="btn btn-primary admin-control" id="uploadBtn" onclick="document.getElementById('fileChooser').click()">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên tại đây
                    </button>
                </div>
            </div>

            <div class="upload-queue-container" id="uploadQueue"></div>

            <div class="file-table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40%;">Tên</th>
                            <th style="width: 15%;">Kích thước</th>
                            <th style="width: 25%;">Ngày cập nhật</th>
                            <th style="width: 20%; text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="fileList"></tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-folder-open" style="font-size:3rem; opacity:0.5; margin-bottom:1rem; display:block;"></i>
                <p id="emptyStateText">Thư mục trống.</p>
            </div>
        </div>
    </div>

    <script>
        const WORKER_API_URL = 'https://db.khanggiaphuc.com'; 
        let currentPath = ''; 
        let userRole = 'user'; 

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('r2_theme') || 'dark';
            document.getElementById('themeSelect').value = savedTheme;
            changeTheme(savedTheme);
            setupDragAndDrop();
        });

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('r2_theme', themeName);
        }

        function getAuthToken() {
            let token = localStorage.getItem('r2_access_token');
            if (!token) {
                token = prompt("Mời nhập Mật khẩu truy cập hệ thống R2:");
                if (token && token.trim() !== "") {
                    localStorage.setItem('r2_access_token', token.trim());
                    return token.trim();
                }
            }
            return token || '';
        }

        function logoutSystem() {
            localStorage.removeItem('r2_access_token');
            location.reload();
        }

        function isEditableTextFile(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['txt', 'html', 'htm', 'css', 'js', 'json', 'md', 'py', 'php', 'xml', 'log', 'env', 'sh', 'csv'].includes(ext);
        }

        function getIcon(name, isDir) {
            if (isDir) return '<i class="fa-solid fa-folder icon-folder"></i>';
            const ext = name.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp', 'ico'].includes(ext)) return '<i class="fa-solid fa-file-image icon-image"></i>';
            if (['html', 'css', 'js', 'json', 'py', 'php'].includes(ext)) return '<i class="fa-solid fa-file-code icon-code"></i>';
            return '<i class="fa-solid fa-file-lines icon-file"></i>';
        }

        function renderBreadcrumbs() {
            const nav = document.getElementById('pathNav');
            let html = `<span class="path-item" onclick="navigateToPath('')"><i class="fa-solid fa-house"></i> Root</span>`;
            if (currentPath) {
                const parts = currentPath.split('/').filter(p => p);
                let buildPath = '';
                parts.forEach((part, index) => {
                    buildPath += part + '/';
                    html += ` <span class="path-separator">/</span> `;
                    if (index === parts.length - 1) {
                        html += `<span class="path-item active">${part}</span>`;
                    } else {
                        html += `<span class="path-item" onclick="navigateToPath('${buildPath}')">${part}</span>`;
                    }
                });
            }
            nav.innerHTML = html;
        }

        function navigateToPath(path) {
            currentPath = path;
            refreshDirectory();
        }

        async function refreshDirectory() {
            const token = getAuthToken();
            if (!token) {
                document.getElementById('fileList').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger); padding:2rem;">Yêu cầu mật khẩu đăng nhập...</td></tr>`;
                setTimeout(() => location.reload(), 1000);
                return;
            }

            renderBreadcrumbs();
            const tbody = document.getElementById('fileList');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 2rem;"><i class="fa-solid fa-spinner fa-spin"></i> Đang đọc dữ liệu...</td></tr>`;
            emptyState.style.display = 'none';

            try {
                let response = await fetch(`${WORKER_API_URL}?prefix=${encodeURIComponent(currentPath)}`, {
                    headers: { 'Authorization': token }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('r2_access_token');
                    alert("Mật khẩu không chính xác!");
                    location.reload(); return;
                }

                let data = await response.json();
                userRole = data.role;
                
                document.getElementById('roleTxt').innerText = userRole === 'admin' ? 'Quyền: Quản trị viên' : 'Quyền: Khách (Chỉ đọc)';
                const adminElements = document.querySelectorAll('.admin-control');
                adminElements.forEach(el => el.style.display = userRole === 'admin' ? 'flex' : 'none');

                tbody.innerHTML = '';

                if (currentPath !== '') {
                    const parentRow = document.createElement('tr');
                    parentRow.innerHTML = `<td colspan="4"><div class="file-name-container" style="cursor: pointer;" onclick="goUpToParent()"><i class="fa-solid fa-arrow-turn-up" style="transform: rotate(-90deg); color: var(--primary);"></i><span class="file-link">[ Thư mục cha .. ]</span></div></td>`;
                    tbody.appendChild(parentRow);
                }

                if (!data.items || data.items.length === 0) {
                    if (currentPath === '') emptyState.style.display = 'block';
                    return;
                }

                data.items.forEach(item => {
                    const row = document.createElement('tr');
                    let displayName = item.name.replace(currentPath, '');
                    if (item.isDir && displayName.endsWith('/')) displayName = displayName.slice(0, -1);

                    let actionHtml = ``;
                    if (item.isDir) {
                        row.innerHTML = `
                            <td><div class="file-name-container" onclick="navigateToPath('${item.name}')">${getIcon(item.name, true)}<span class="file-link" style="color: #eab308; font-weight:600;">${displayName}</span></div></td>
                            <td class="file-size">--</td><td class="file-date">--</td><td style="text-align:center;">--</td>
                        `;
                    } else {
                        const pathParts = item.name.split('/').map(part => encodeURIComponent(part));
                        const fileDownloadUrl = `https://r2.khanggiaphuc.com/${pathParts.join('/')}`;
                        
                        // NÚT SỬA VĂN BẢN TRÊN TAB MỚI HOÀN TOÀN
                        if (userRole === 'admin' && isEditableTextFile(displayName)) {
                            actionHtml += `<button class="btn-action btn-edit-text" onclick="openEditorInNewTab('${item.name}', '${displayName}')" title="Mở trang chỉnh sửa văn bản trên Tab mới"><i class="fa-solid fa-file-pen"></i></button>`;
                        }

                        actionHtml += `<button class="btn-action btn-copy" onclick="copyLinkToClipboard('${fileDownloadUrl}')" title="Sao chép liên kết tải xuống"><i class="fa-solid fa-copy"></i></button>`;
                        
                        if (userRole === 'admin') {
                            actionHtml += `
                                <button class="btn-action btn-rename" onclick="renameFile('${item.name}', '${displayName}')" title="Đổi tên"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="btn-action btn-delete" onclick="deleteFile('${item.name}')" title="Xóa tập tin"><i class="fa-solid fa-trash"></i></button>
                            `;
                        }

                        row.innerHTML = `
                            <td><div class="file-name-container">${getIcon(item.name, false)}<span class="file-link" onclick="downloadSecureFile('${item.name}', '${displayName}')">${displayName}</span></div></td>
                            <td class="file-size">${item.size}</td><td class="file-date">${item.date}</td>
                            <td style="text-align: center;">${actionHtml}</td>
                        `;
                    }
                    tbody.appendChild(row);
                });

            } catch (error) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
            }
        }

        function goUpToParent() {
            const parts = currentPath.split('/').filter(p => p);
            parts.pop();
            currentPath = parts.length > 0 ? parts.join('/') + '/' : '';
            refreshDirectory();
        }

        // =====================================================================
        // CHỨC NĂNG NÂNG CẤP: MỞ TRÌNH CẢI TIẾN TRÊN TAB MỚI ĐỘC LẬP HOÀN TOÀN
        // =====================================================================
        async function openEditorInNewTab(fileKey, fileName) {
            const token = getAuthToken();
            
            // 1. Mở ngay một Tab trống để chống bị trình duyệt chặn Pop-up
            const newTab = window.open('', '_blank');
            if (!newTab) {
                alert("Vui lòng cho phép trình duyệt mở cửa sổ Bật lên (Pop-up) để chỉnh sửa file!");
                return;
            }

            newTab.document.write(`
                <!DOCTYPE html>
                <html><head><title>Đang tải ${fileName}...</title>
                <style>body{background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}</style>
                </head><body><h2>Đang nạp dữ liệu từ Cloudflare R2...</h2></body></html>
            `);

            try {
                // 2. Lấy nội dung file từ Worker
                let response = await fetch(`${WORKER_API_URL}/${encodeURIComponent(fileKey)}`, {
                    headers: { 'Authorization': token }
                });
                if (!response.ok) throw new Error("Không thể tải file");
                let textContent = await response.text();

                // Escape chuỗi an toàn khi truyền vào JavaScript
                const safeContent = JSON.stringify(textContent);
                const safeKey = JSON.stringify(fileKey);
                const safeFileName = JSON.stringify(fileName);
                const safeApiUrl = JSON.stringify(WORKER_API_URL);
                const safeToken = JSON.stringify(token);

                // 3. Render giao diện Trình soạn thảo chuyên nghiệp ở Tab mới
                newTab.document.open();
                newTab.document.write(`
                    <!DOCTYPE html>
                    <html lang="vi">
                    <head>
                        <meta charset="UTF-8">
                        <title>Đang chỉnh sửa: ${fileName}</title>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                        <style>
                            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
                            body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
                            .editor-bar { background: rgba(30, 41, 59, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
                            .file-info { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; color: #38bdf8; }
                            .editor-box { flex: 1; padding: 1.5rem; background: #020617; color: #38bdf8; border: none; outline: none; font-family: 'Consolas', 'Monaco', monospace; font-size: 1rem; line-height: 1.6; resize: none; }
                            .btn-save { background: #2563eb; color: #fff; border: none; padding: 0.6rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: background 0.2s; }
                            .btn-save:hover { background: #1d4ed8; }
                            .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
                        </style>
                    </head>
                    <body>
                        <div class="editor-bar">
                            <div class="file-info"><i class="fa-solid fa-code"></i> SOẠN THẢO: ${fileName}</div>
                            <button class="btn-save" id="btnSave" onclick="saveData()"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button>
                        </div>
                        <textarea class="editor-box" id="codeContent" spellcheck="false"></textarea>

                        <script>
                            const fileKey = ${safeKey};
                            const WORKER_API_URL = ${safeApiUrl};
                            const token = ${safeToken};
                            document.getElementById('codeContent').value = ${safeContent};

                            async function saveData() {
                                const btn = document.getElementById('btnSave');
                                const val = document.getElementById('codeContent').value;
                                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';
                                btn.disabled = true;

                                try {
                                    let res = await fetch(WORKER_API_URL + '/save-text', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json', 'Authorization': token },
                                        body: JSON.stringify({ fileKey: fileKey, content: val })
                                    });

                                    if (res.ok) {
                                        alert("Đã lưu nội dung thành công vào R2!");
                                    } else {
                                        alert("Lỗi khi lưu dữ liệu.");
                                    }
                                } catch (e) {
                                    alert("Lỗi kết nối: " + e.message);
                                } finally {
                                    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi';
                                    btn.disabled = false;
                                }
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                newTab.document.close();
            } catch (e) {
                newTab.document.body.innerHTML = "<h3 style='color:#ef4444;'>Lỗi khi nạp file: " + e.message + "</h3>";
            }
        }

        async function createNewFolder() {
            const token = getAuthToken();
            const folderName = prompt("Nhập tên thư mục mới muốn tạo:");
            if (!folderName || folderName.trim() === "") return;

            const folderPath = currentPath + folderName.trim() + "/";

            try {
                let response = await fetch(`${WORKER_API_URL}/create-folder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ folderPath: folderPath })
                });
                if (response.ok) {
                    alert("Tạo thư mục thành công!");
                    refreshDirectory();
                } else {
                    alert("Lỗi không thể tạo thư mục.");
                }
            } catch (e) { alert("Lỗi kết nối."); }
        }

        function copyLinkToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Đã sao chép liên kết tải xuống!");
            }).catch(err => {
                const el = document.createElement('textarea');
                el.value = text; document.body.appendChild(el);
                el.select(); document.execCommand('copy');
                document.body.removeChild(el);
                alert("Đã sao chép liên kết tải xuống!");
            });
        }

        async function downloadSecureFile(fileKey, fileName) {
            const token = getAuthToken();
            try {
                let response = await fetch(`${WORKER_API_URL}/${encodeURIComponent(fileKey)}`, { headers: { 'Authorization': token } });
                if (!response.ok) { alert("Tải xuống thất bại."); return; }
                const blob = await response.blob();
                const dlUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = dlUrl; a.download = fileName;
                document.body.appendChild(a); a.click(); a.remove();
            } catch (e) { alert("Lỗi tải: " + e.message); }
        }

        async function deleteFile(fileKey) {
            const token = getAuthToken();
            if (!confirm(`Anh có chắc chắn muốn xóa tập tin này không?`)) return;
            try {
                let response = await fetch(`${WORKER_API_URL}/${encodeURIComponent(fileKey)}`, { method: 'DELETE', headers: { 'Authorization': token } });
                if (response.ok) { alert("Đã xóa thành công!"); refreshDirectory(); } else { alert("Lỗi xóa."); }
            } catch (e) { alert("Lỗi kết nối."); }
        }

        async function renameFile(oldKey, currentName) {
            const token = getAuthToken();
            const newName = prompt("Nhập tên mới cho tập tin:", currentName);
            if (!newName || newName.trim() === "" || newName === currentName) return;
            const newKey = currentPath + newName.trim();
            try {
                let response = await fetch(`${WORKER_API_URL}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ oldKey, newKey })
                });
                if (response.ok) { alert("Đã đổi tên!"); refreshDirectory(); } else { alert("Thao tác thất bại."); }
            } catch (e) { alert("Lỗi kết nối."); }
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            window.addEventListener('dragenter', (e) => {
                e.preventDefault();
                if (userRole === 'admin') dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
            dropZone.addEventListener('dragleave', (e) => {
                const rect = dropZone.getBoundingClientRect();
                if (e.clientX < rect.left || e.clientX >= rect.right || e.clientY < rect.top || e.clientY >= rect.bottom) {
                    dropZone.classList.remove('drag-over');
                }
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (userRole !== 'admin') { alert("Quyền Khách không thể tải tập tin lên!"); return; }
                const files = e.dataTransfer.files;
                if (files && files.length > 0) uploadMultipleFiles(files);
            });
        }

        async function uploadMultipleFiles(files) {
            if (files.length === 0) return;
            const token = getAuthToken();
            const uploadQueue = document.getElementById('uploadQueue');
            uploadQueue.style.display = 'flex';

            const uploadPromises = Array.from(files).map((file, index) => {
                return new Promise((resolve) => {
                    const itemId = 'upload_item_' + Date.now() + '_' + index;
                    const fullTargetName = currentPath + file.name;

                    const queueItem = document.createElement('div');
                    queueItem.className = 'queue-item'; queueItem.id = itemId;
                    queueItem.innerHTML = `
                        <div class="queue-item-info">
                            <span class="queue-item-name"><i class="fa-solid fa-file-arrow-up"></i> &nbsp;${file.name}</span>
                            <span class="queue-item-status" id="${itemId}_pct">Khởi tạo...</span>
                        </div>
                        <div class="queue-item-progress-bg"><div class="queue-item-progress-bar" id="${itemId}_bar"></div></div>
                    `;
                    uploadQueue.appendChild(queueItem);

                    fetch(`${WORKER_API_URL}/get-upload-url`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': token },
                        body: JSON.stringify({ fileName: fullTargetName })
                    })
                    .then(res => res.json())
                    .then(result => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('PUT', result.uploadUrl, true);
                        xhr.setRequestHeader('X-Amz-Content-Sha256', 'UNSIGNED-PAYLOAD');

                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable) {
                                const percent = Math.round((e.loaded / e.total) * 100);
                                document.getElementById(`${itemId}_bar`).style.width = percent + '%';
                                document.getElementById(`${itemId}_pct`).innerText = percent + '%';
                            }
                        };

                        xhr.onload = () => {
                            if (xhr.status === 200 || xhr.status === 201) {
                                document.getElementById(`${itemId}_pct`).innerHTML = '<span style="color:var(--success);"><i class="fa-solid fa-circle-check"></i> Xong</span>';
                                setTimeout(() => queueItem.remove(), 2500);
                                resolve(true);
                            } else {
                                document.getElementById(`${itemId}_pct`).innerHTML = '<span style="color:var(--danger);">Thất bại</span>';
                                resolve(false);
                            }
                        };
                        xhr.onerror = () => {
                            document.getElementById(`${itemId}_pct`).innerHTML = '<span style="color:var(--danger);">Lỗi mạng</span>';
                            resolve(false);
                        };
                        xhr.send(file);
                    })
                    .catch(err => {
                        document.getElementById(`${itemId}_pct`).innerHTML = `<span style="color:var(--danger);">${err.message}</span>`;
                        resolve(false);
                    });
                });
            });

            await Promise.all(uploadPromises);
            setTimeout(() => { if (uploadQueue.children.length === 0) uploadQueue.style.display = 'none'; }, 4000);
            refreshDirectory();
            document.getElementById('fileChooser').value = '';
        }

        window.onload = refreshDirectory;
    </script>
</body>
</html>
